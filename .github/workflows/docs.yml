name: Documentation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 20 * * *"

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: node:24.12.0-bookworm
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify Node version
        run: test "v$(cat .node-version)" = "$(node --version)"
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Script tests
        run: pnpm test
      - name: Typecheck, lint and formatting
        run: pnpm check
      - name: Documentation consistency
        run: pnpm check-consistency
      - name: Build all locales
        run: pnpm build
      - name: Translation lag report
        if: always()
        run: |
          {
            echo '### Translation status'
            echo '```'
            node scripts/translation-lock.mjs status
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4.159.0 pages deploy build --project-name zaidrama-docs --branch main --commit-hash "$GITHUB_SHA"
